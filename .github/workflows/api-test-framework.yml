name: api-test-framework

on:
  push:
    paths: ["api-test-framework/**", ".github/workflows/api-test-framework.yml"]
  pull_request:
    paths: ["api-test-framework/**", ".github/workflows/api-test-framework.yml"]
  workflow_dispatch:
    inputs:
      selection:
        description: "Optional pytest filter, e.g. -m smoke"
        required: false
        default: ""

defaults:
  run:
    working-directory: api-test-framework

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-test-framework/requirements.txt
      - run: pip install -r requirements.txt
      - name: Framework self-tests
        run: pytest selftests -q --junitxml=reports/selftests.xml
      - name: Start demo API
        run: |
          mkdir -p reports
          nohup python -m apitest demo-server --port 8000 > reports/demo-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://localhost:8000/health && break; sleep 0.5; done
      - name: API tests (local demo environment)
        env:
          SELECTION: ${{ inputs.selection }}
          SEED: ${{ github.run_number }}
        run: pytest --env local --seed "$SEED" --junitxml=reports/api-tests.xml $SELECTION
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-reports
          path: api-test-framework/reports/
